<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grantide · 允界</title><meta name="description" content="A clear boundary for every agent action.">
  <link rel="icon" href="/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login-screen" hidden></div>
  <div id="app" hidden>
    <aside class="sidebar"><a class="brand" href="/"><img src="/mark.svg" alt=""><span>Grantide<small>允界 · Agent access</small></span></a><div class="workspace"><span class="status-dot"></span><span id="workspace-label">Local workspace</span><span class="mono">01</span></div><nav id="nav" aria-label="Main navigation"></nav><div class="side-bottom"><div class="boundary-mark">◈</div><strong id="boundary-title"></strong><p id="boundary-copy"></p><span class="version">v0.1 · experimental alpha</span></div></aside>
    <div class="shell"><header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="crumb"></strong></div><div class="top-actions"><span id="connection" class="connection"></span><button id="language" class="icon-button" aria-label="Switch language">EN</button><button id="logout" class="icon-button" aria-label="Sign out">↗</button><div class="avatar" title="Operator">O</div></div></header><div id="demo-banner"></div><main id="main"></main><footer id="footer"></footer></div>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
