name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/grantide
      - run: node --check internal/webui/assets/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s skills/grantide-login/scripts -p "test_*.py"
  browser-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-worker/package-lock.json
      - run: npm ci --prefix browser-worker --ignore-scripts
      - run: npx --prefix browser-worker playwright install --with-deps chromium
      - run: npm test --prefix browser-worker
